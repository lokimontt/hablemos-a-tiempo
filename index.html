<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Actividad educativa sobre mitos, realidades y acciones para la prevención del suicidio en Chile."
    />
    <meta name="theme-color" content="#073542" />
    <title>Hablemos a tiempo | Prevención del suicidio</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#actividad">Ir a la actividad</a>

    <div class="site-shell">
      <header class="topbar">
        <div class="brand" aria-label="Hablemos a tiempo">
          <span class="brand__mark" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
          <span class="brand__copy">
            <strong>Hablemos a tiempo</strong>
            <small>Prevención del suicidio</small>
          </span>
        </div>

        <a class="support-pill" href="tel:*4141" aria-label="Llamar a la Línea de Prevención del Suicidio al *4141">
          <span>¿Necesitas apoyo ahora?</span>
          <strong>Llama al *4141</strong>
        </a>
      </header>

      <main id="actividad" class="stage" tabindex="-1">
        <section
          class="carousel"
          aria-roledescription="carrusel"
          aria-label="Actividad sobre prevención del suicidio"
        >
          <div class="carousel__texture" aria-hidden="true"></div>
          <div class="carousel__glow" aria-hidden="true"></div>
          <div class="carousel__ring carousel__ring--one" aria-hidden="true"></div>
          <div class="carousel__ring carousel__ring--two" aria-hidden="true"></div>

          <div id="slide" class="slide-host" aria-live="polite" aria-atomic="true"></div>

          <div class="carousel__footer">
            <div class="controls" aria-label="Controles de la actividad">
              <button id="previousButton" class="icon-button" type="button" aria-label="Pregunta anterior">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="m14.5 5-7 7 7 7" />
                </svg>
              </button>

              <button id="playButton" class="play-button" type="button" aria-label="Pausar avance automático">
                <svg class="play-button__pause" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M8 5v14M16 5v14" />
                </svg>
                <svg class="play-button__play" aria-hidden="true" viewBox="0 0 24 24">
                  <path d="m8 5 11 7-11 7Z" />
                </svg>
                <span>Pausar</span>
              </button>

              <button id="nextButton" class="icon-button" type="button" aria-label="Pregunta siguiente">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="m9.5 5 7 7-7 7" />
                </svg>
              </button>
            </div>

            <div class="progress-area">
              <div id="dots" class="dots" aria-label="Seleccionar una pantalla"></div>
              <div class="progress-track" aria-hidden="true">
                <span id="progressFill" class="progress-fill"></span>
              </div>
            </div>

            <div class="utility-controls">
              <span id="counter" class="counter" aria-hidden="true">01 / 08</span>
              <button id="fullscreenButton" class="fullscreen-button" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
                </svg>
                <span>Pantalla completa</span>
              </button>
            </div>
          </div>
        </section>
      </main>

      <footer class="page-footer">
        <p>Escuchar sin juzgar también es prevenir.</p>
        <a href="https://www.minsal.cl/linea-de-atencion-4141-no-estas-solo-no-estas-sola/" target="_blank" rel="noreferrer">
          Información oficial MINSAL
        </a>
      </footer>
    </div>

    <noscript>
      <div class="noscript-message">
        Esta actividad necesita JavaScript para cambiar de pantalla. Si necesitas apoyo, llama gratis al *4141 desde un celular.
      </div>
    </noscript>
  </body>
</html>
